name: verify-deploy
on:
  push:
    branches: [ main ]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Railway redeploy
        run: sleep 90
      - name: Check /version on production
        run: |
          URL="${RAILWAY_URL:-https://eroom-transfer-production.up.railway.app}/version"
          echo "Checking $URL"
          curl -fsS "$URL" | tee /tmp/v.json
          grep -q '"version":"1.1.0"' /tmp/v.json && echo "✅ v1.1.0 live" || (echo "⚠️ version mismatch"; exit 1)
